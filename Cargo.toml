[workspace]
members = ["."]
resolver = "3"

[package]
name = "hoori-term"
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.98"
publish = false
build = "build.rs"

[features]
validation = []

[dependencies]
alacritty_terminal = { version = "=0.26.0", default-features = false }
base64 = "=0.22.1"
iced = { version = "=0.14.0", default-features = false, features = ["wgpu", "canvas", "tokio", "x11", "wayland"] }
portable-pty = "=0.9.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "1.53", features = ["time"] }
unicode-width = "=0.2.2"
log = "=0.4.34"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["fs", "signal", "process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_System_IO"] }

[profile.release]
strip = "debuginfo"
